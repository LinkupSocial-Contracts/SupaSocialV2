<!DOCTYPE html>

<html lang="en-us">
<head>
    <title>CLOSE Page</title>

<link rel="stylesheet" href="Styles.css">
<link rel="icon" href="fav.ico">

<script src="usrchk.js"></script>


</head>

<body>


<div id="nav">
    <button class="nav_btn" onclick="LoadPrivate()">Privacy Policy</button>
    <button class="nav_btn" onclick="LoadTerms()">Terms Of Service</button>
    <button class="nav_btn" id="nav_rfsh" onclick="loadPage()"><img src="Refresh24.png"></button>
</div>

<hr>

<!-- Posts will be loaded here -->
<div class="grid" id="posts"></div>

<span class="footer">
</span>


<script>
    function LoadPrivate()
    {
        window.location.href = "./policies/privacy/index.html";
    }

    function LoadTerms()
    {
        window.location.href = "./policies/terms/index.html";
    }
</script>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://paotmlgoayixvwozvohp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XX-Ofl8fQ1JL7n6Ei6kFdw_sb5bT-xk";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function loadPosts()
{
const { data, error } = await supabaseClient
.from("posts")
.select('id, "user_id", title, content, created_at')
.order("created_at", { ascending: false });

if (error)
{
    console.error("Supabase error:", error);
    return;
}

const postsContainer = document.getElementById("posts");

postsContainer.innerHTML = data.map(post => `
    <div class="post" id="${post.id}">
        <h1>${post.title}</h1>

        <p class="datetimenow">
            ${new Date(post.created_at).toLocaleDateString()}
        </p>

        <hr>

        <h3>${post.content}</h3>
    </div>
`).join("");

}

function loadPage()
{
    window.location.href = "./index.html";
}

loadPosts();
</script>

</body>
</html>
